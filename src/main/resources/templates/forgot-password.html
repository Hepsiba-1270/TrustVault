
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Recover Account</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #244d91);
            color: #172554;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 50px #0004;
        }

        h1 { margin: 0; text-align: center; color: #173b83; }
        .subtitle {
            margin: 12px 0 24px;
            color: #64748b;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2457d6;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .65; cursor: wait; }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error { display: block; background: #fff0ef; color: #b42318; }
        .success { display: block; background: #eaf8ef; color: #187344; }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
        }

        a { color: #2457d6; font-weight: bold; text-decoration: none; }

        @media (max-width: 480px) {
            .card { padding: 25px 21px; }
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Recover Account</h1>
    <p class="subtitle">
        Reset your TrustVault password securely.
    </p>

    <form id="recoveryForm">
        <input type="hidden"
               id="csrfToken"
               th:value="${_csrf.token}">
        <input type="hidden"
               id="csrfHeader"
               th:value="${_csrf.headerName}">

        <label for="username">Username</label>
        <input id="username" name="username" required
               autocomplete="username" placeholder="Enter your username">

        <label for="method">Recovery method</label>
        <select id="method" name="method">
            <option value="question">Recovery Question</option>
            <option value="code">Recovery Code</option>
        </select>

        <div id="questionFields">
            <label for="answer">Your Recovery Answer</label>
            <input id="answer" name="answer" autocomplete="off"
                   placeholder="Enter your saved answer">
        </div>

        <div id="codeFields" hidden>
            <label for="code">Recovery Code</label>
            <input id="code" name="code" autocomplete="off"
                   placeholder="Enter your recovery code">
        </div>

        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" type="password"
               minlength="8" maxlength="72"
               autocomplete="new-password"
               placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password"
               minlength="8" maxlength="72"
               autocomplete="new-password"
               placeholder="Re-enter your new password" required>

        <button id="submitButton" type="submit">Reset Password</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div class="footer">
        <a th:href="@{/login}">← Back to Sign In</a>
    </div>
</main>

<script>
    const method = document.getElementById("method");
    const questionFields = document.getElementById("questionFields");
    const codeFields = document.getElementById("codeFields");
    const answer = document.getElementById("answer");
    const code = document.getElementById("code");
    const form = document.getElementById("recoveryForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    function updateMethod() {
        const useCode = method.value === "code";
        questionFields.hidden = useCode;
        codeFields.hidden = !useCode;
        answer.required = !useCode;
        code.required = useCode;
    }

    method.addEventListener("change", updateMethod);
    updateMethod();

    function showMessage(text, success) {
        message.textContent = text;
        message.className = "message " + (success ? "success" : "error");
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            showMessage("Passwords do not match.", false);
            return;
        }

        if (newPassword.length < 8 || newPassword.length > 72) {
            showMessage("Password must be between 8 and 72 characters.", false);
            return;
        }

        const useCode = method.value === "code";
        const endpoint = useCode
            ? "/api/account/reset-by-code"
            : "/api/account/reset-by-question";

        const payload = useCode
            ? { username, code: code.value.trim(), newPassword }
            : { username, answer: answer.value, newPassword };

        const csrfToken = document.getElementById("csrfToken").value;
        const csrfHeader = document.getElementById("csrfHeader").value;

        button.disabled = true;
        button.textContent = "Please wait...";

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showMessage(
                    data.message || "Password reset failed. Check your details and try again.",
                    false
                );
                return;
            }

            showMessage(
                (data.message || "Password reset successful.") +
                " You can now sign in.",
                true
            );

            form.reset();
            updateMethod();
        } catch (error) {
            showMessage("Could not connect to the server. Please try again.", false);
        } finally {
            button.disabled = false;
            button.textContent = "Reset Password";
        }
    });
</script>
</body>
</html>
