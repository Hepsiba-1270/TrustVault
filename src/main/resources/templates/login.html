
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Sign In</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #172554;
            background:
                linear-gradient(rgba(5,15,38,.70), rgba(5,15,38,.82)),
                url('/images/sigin.jpg') center / cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 410px;
            padding: 36px;
            background: rgba(255,255,255,.98);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 20px;
            box-shadow: 0 24px 65px rgba(0,0,0,.30);
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8efff;
            font-size: 29px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #173b83;
            font-size: 30px;
            letter-spacing: -.5px;
        }

        .subtitle {
            margin: 10px 0 27px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group { margin-bottom: 19px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #26364a;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: #172554;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2457d6;
            box-shadow: 0 0 0 3px rgba(36,87,214,.13);
        }

        .forgot-row {
            margin-top: -7px;
            margin-bottom: 21px;
            text-align: right;
        }

        a {
            color: #2457d6;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        .primary-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2457d6;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .primary-button:hover {
            background: #173f9f;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        .security-note {
            margin: 21px 0 0;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body { padding: 16px; background-attachment: scroll; }
            .card { padding: 28px 22px; }
        }
    </style>
</head>

<body>
<main class="card">
    <div class="brand-icon" aria-hidden="true">&#128274;</div>

    <h1>TrustVault</h1>
    <p class="subtitle">
        Secure Document Sharing<br>
        Sign in to access your account.
    </p>

    <p th:if="${param.error}" class="error" role="alert">
        Invalid username or password. Please try again.
    </p>

    <p th:if="${param.logout}" role="status">
        You have signed out successfully.
    </p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username"
                   type="text"
                   name="username"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>
        </div>

        <div class="forgot-row">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <button class="primary-button" type="submit">Sign In</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a th:href="@{/signup}">Create an account</a>
    </div>

    <p class="security-note">
        &#128274; Secure access. Every action matters.
    </p>
</main>
</body>
</html>
